<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OurNotes 火焰計算機</title>
    <style>
        body { font-family: '微軟正黑體', sans-serif; padding: 20px; background-color: #f4f4f9; }
        
        /* 1. 將最大寬度放寬，才有足夠的空間並排 */
        .app-container { max-width: 800px; margin: 0 auto; }
        
        /* --- 新增：左右並排的大排版 --- */
        .two-column-layout { 
            display: flex;      /* 啟動彈性排版，讓裡面的元素並排 */
            gap: 20px;          /* 左右兩個區塊中間的間距 */
            align-items: stretch; /* 讓左右兩邊的高度自動對齊一樣高 */
        }
        /* 讓左右兩欄各佔 50% 寬度 */
        .column { 
            flex: 1; 
            display: flex; 
            flex-direction: column; 
        }

        .block { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); margin-bottom: 15px; }
        
        /* 讓右側的輸出區塊能填滿整個高度，看起來更對稱 */
        .output-block { background: #e8f4f8; border: 2px solid #b3e0ff; flex: 1; margin-bottom: 0; }
        
        /* 按鈕與輸入框樣式 */
        .btn-group { display: flex; gap: 10px; margin: 10px 0 15px 0; }
        .option-btn { flex: 1; padding: 10px; background: white; border: 2px solid #ccc; border-radius: 4px; cursor: pointer; color: #666; font-weight: bold; }
        .option-btn.active { border-color: #007bff; background: #e7f1ff; color: #007bff; }
        
        .input-row { display: flex; gap: 15px; }
        .input-item { flex: 1; } 
        input { width: 100%; box-sizing: border-box; padding: 8px; margin-top: 5px; border: 1px solid #ccc; border-radius: 4px; }

        /* 調整按鈕，讓它貼齊左側底部 */
        .calc-btn { width: 100%; padding: 12px; background: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; margin-top: auto; }
        .calc-btn:hover { background: #218838; }

        /* --- 新增：手機版響應式設計 (RWD) --- */
        /* 當螢幕寬度小於 600px (如手機) 時，取消並排，改為上下排列 */
        @media (max-width: 600px) {
            .two-column-layout {
                flex-direction: column;
            }
            .output-block { margin-top: 15px; }
        }
        
        /*有%符號的輸入框*/
        .percent-input {
            position: relative;
        }
        
        .percent-input input {
            width: 100%;
            box-sizing: border-box;
            padding-right: 30px;
        }
        
        .percent-input span {
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: #999;
            pointer-events: none;
        }
    </style>
</head>
<body>

<div class="app-container">
    <h3>Our notes 火焰計算機</h3>

    <div class='row'>
        <div class="two-column-layout">
            <div class = 'column'>
                <div class="input-item">
                    <label for="presentPt">目前pt：</label>
                    <input type="number" id="presentPt" value="0" min="0" oninput="this.value = this.value.replace(/\D/g, '')">
                </div>
            </div>
            <div class = 'column'>
                <div class="input-item">
                    <label for="presentBadge">目前勳章：</label>
                    <input type="number" id="presentBadge" value="0" min="0" oninput="this.value = this.value.replace(/\D/g, '')">
                </div>
            </div>
        </div>
    </div>
    <div class='row'>
        <div class="two-column-layout">
            <div class = 'column'>
                <div class="input-item">
                    <label for="goalPt">目標pt：</label>
                    <input type="number" id="goalPt" value="525000" min="0" oninput="this.value = this.value.replace(/\D/g, '')">
                </div>
            </div>
            <div class = 'column'>
                <div class="input-item">
                    <label for="goalBadge">目標勳章：</label>
                    <input type="number" id="goalBadge" value="475000" min="0" oninput="this.value = this.value.replace(/\D/g, '')">
                </div>
            </div>
        </div>
    </div>
    
    <br>
    <!-- 開始左右並排的容器 -->
    <div class="two-column-layout">
        
        <!-- 左側欄位：放輸入區塊與計算按鈕 -->
        <div class="column">
            <!-- 區塊一：一般場設定 -->
            <div class="block">
                <h4>一般場</h4>
                <label>分數等級</label>
                <div class="btn-group">
                    <button class="option-btn active" onclick="selectOption('rankNormal', 'D', this)">D</button>
                    <button class="option-btn" onclick="selectOption('rankNormal', 'C', this)">C</button>
                    <button class="option-btn" onclick="selectOption('rankNormal', 'B', this)">B</button>
                    <button class="option-btn" onclick="selectOption('rankNormal', 'A', this)">A</button>
                    <button class="option-btn" onclick="selectOption('rankNormal', 'S', this)">S</button>
                    <button class="option-btn" onclick="selectOption('rankNormal', 'SS', this)">SS</button>
                </div>
                
                <div class="input-row">
                    <div class="percent-input">
                        <label for="weaponCount">角色加成：</label>
                        <input type="number" id="charNormal" value="1" min="0" oninput="this.value = this.value.replace(/\D/g, '')">
                    </div>
                    <div class="percent-input">
                        <label for="weaponLevel">快照加成：</label>
                        <input type="number" id="snapNormal" value="0" min="0" oninput="this.value = this.value.replace(/\D/g, '')">
                    </div>
                </div>
            </div>
        </div>
        <div class="column">
            <!-- 區塊二：活動場設定 -->
            <div class="block">
                <h4>活動場</h4>
                <label>分數等級</label>
                <div class="btn-group">
                    <button class="option-btn active" onclick="selectOption('rankEvent', 'D', this)">D</button>
                    <button class="option-btn" onclick="selectOption('rankEvent', 'C', this)">C</button>
                    <button class="option-btn" onclick="selectOption('rankEvent', 'B', this)">B</button>
                    <button class="option-btn" onclick="selectOption('rankEvent', 'A', this)">A</button>
                    <button class="option-btn" onclick="selectOption('rankEvent', 'S', this)">S</button>
                    <button class="option-btn" onclick="selectOption('rankEvent', 'SS', this)">SS</button>
                </div>
                
                <div class="input-row">
                    <div class="percent-input">
                        <label for="weaponCount">角色加成：</label>
                        <input type="number" id="charEvent" value="1" min="0" oninput="this.value = this.value.replace(/\D/g, '')">
                    </div>
                    <div class="percent-input">
                        <label for="weaponLevel">快照加成：</label>
                        <input type="number" id="snapEvent" value="0" min="0" oninput="this.value = this.value.replace(/\D/g, '')">
                    </div>
                </div>
            </div>
        </div>
    </div> <!-- 結束並排容器 -->
    <br>
    <div class='row'>
        <button class="calc-btn" onclick="calculate()">計算總計</button>
    </div>
    <br>
    <div class='row'>
        <div class="block output-block">
            <h4>總計結果</h4>
            <div id='result'></div>
        </div>
    </div>
</div>

    


<script>
    const gameData = {
        normal: {
            name: "normal",
            items: [
                {id: 'rank_D', name: 'D', pt: 15, badge: 18, cp:3},
                {id: 'rank_C', name: 'C', pt: 25, badge: 30, cp:4},
                {id: 'rank_B', name: 'B', pt: 35, badge: 42, cp:5},
                {id: 'rank_A', name: 'A', pt: 50, badge: 60, cp:6},
                {id: 'rank_S', name: 'S', pt: 75, badge: 90, cp:8},
                {id: 'rank_SS', name: 'SS', pt: 100, badge: 120, cp:10},
            ],
        },
        event: {
            name:"event",
            items: [
                {id: 'rank_D', name: 'D', pt: 1500, badge: 2150},
                {id: 'rank_C', name: 'C', pt: 2000, badge: 2650},
                {id: 'rank_B', name: 'B', pt: 2750, badge: 3400},
                {id: 'rank_A', name: 'A', pt: 3500, badge: 4150},
                {id: 'rank_S', name: 'S', pt: 4500, badge: 4900},
                {id: 'rank_SS', name: 'SS', pt: 5500, badge: 5650},
            ],
        },
    }

    let selections = {
        'rankNormal': 'D',
        'rankEvent': 'D',
    }
    
    function selectOption(category, value, clickedElement) {
        
        // 更新狀態字典
        selections[category] = value;

        // 透過 DOM 操作來切換按鈕顏色，不需要再寫死 ID
        // a. 找到被點擊按鈕的「父容器」 (也就是 .btn-group 那個 div)
        let parentGroup = clickedElement.parentElement;
        
        // b. 在這個父容器內，找出所有帶有 'option-btn' 類別的按鈕
        let buttons = parentGroup.getElementsByClassName('option-btn');
        
        // c. 用迴圈把這個群組內的所有按鈕都清除 active 樣式
        for (let i = 0; i < buttons.length; i++) {
            buttons[i].classList.remove('active');
        }
        
        // d. 只把當下被點擊的這個按鈕加上 active 樣式
        clickedElement.classList.add('active');
    }

    function calculate() {
    try {
        // =========================
        // 取得輸入值
        // =========================
        const presentPt =
            parseInt(document.getElementById('presentPt').value) || 0;

        const goalPt =
            parseInt(document.getElementById('goalPt').value) || 0;

        const presentBadge =
            parseInt(document.getElementById('presentBadge').value) || 0;

        const goalBadge =
            parseInt(document.getElementById('goalBadge').value) || 0;

        const charNormal =
            parseInt(document.getElementById('charNormal').value) || 0;

        const charEvent =
            parseInt(document.getElementById('charEvent').value) || 0;

        const snapNormal =
            parseInt(document.getElementById('snapNormal').value) || 0;

        const snapEvent =
            parseInt(document.getElementById('snapEvent').value) || 0;


        // =========================
        // 計算還需要多少 pt / 勳章
        // =========================
        const needPt = Math.max(goalPt - presentPt, 0);
        const needBadge = Math.max(goalBadge - presentBadge, 0);


        // =========================
        // 找到目前選擇的場次
        // =========================
        const normalBase = gameData.normal.items.find(
            item => item.name === selections.rankNormal
        );

        const eventBase = gameData.event.items.find(
            item => item.name === selections.rankEvent
        );

        if (!normalBase || !eventBase) {
            throw new Error("找不到所選擇的場次資料。");
        }


        // =========================
        // 每場實際取得的 pt / 勳章
        // =========================

        const normalPt =
            normalBase.pt * (1 + charNormal / 100);

        const normalBadge =
            normalBase.badge * (1 + snapNormal / 100);

        const eventPt =
            eventBase.pt * (1 + charEvent / 100);

        const eventBadge =
            eventBase.badge * (1 + snapEvent / 100);


        if (
            normalPt <= 0 ||
            normalBadge <= 0 ||
            eventPt <= 0 ||
            eventBadge <= 0
        ) {
            throw new Error("場次收益資料無效。");
        }


        // =========================
        // 已經達成目標
        // =========================

        if (needPt === 0 && needBadge === 0) {

            document.getElementById('result').innerHTML = `
                <strong>📊 計算結果</strong><br><br>

                目前已經達成目標！<br><br>

                一般場：0 場<br>
                活動場：0 場<br>
                總場數：0 場<br>
                消耗火：<strong>0 火</strong>
            `;

            return;
        }


        // =========================
        // 最佳解搜尋
        // =========================
        //
        // eventGames = 活動場數
        //
        // 對每一個可能的活動場數，
        // 算出需要多少一般場：
        //
        // ① CP 是否足夠
        // ② pt 是否足夠
        // ③ 勳章是否足夠
        //
        // 最後找最少火的組合。
        // =========================

        const maxEventByPt =
            Math.ceil(needPt / eventPt);

        const maxEventByBadge =
            Math.ceil(needBadge / eventBadge);

        /*
         * 如果只靠活動場就能完成目標，
         * 再增加活動場沒有意義。
         *
         * 因此搜尋到能單靠活動場完成目標的位置即可。
         */
        const maxEventGames =
            Math.max(maxEventByPt, maxEventByBadge);


        let best = null;


        for (
            let eventGames = 0;
            eventGames <= maxEventGames;
            eventGames++
        ) {

            // =========================
            // 活動場需要的 CP
            // =========================
            //
            // 例如：
            // 一般場 3 CP
            // 1 活動場需要 200 CP
            //
            // ceil(200 / 3)
            // = 67 場一般場
            //
            const normalGamesForCP =
                Math.ceil(
                    (eventGames * 200) /
                    normalBase.cp
                );


            // =========================
            // 活動場打完之後還缺多少 pt
            // =========================

            const remainingPt =
                needPt -
                eventGames * eventPt;


            const normalGamesForPt =
                remainingPt > 0
                    ? Math.ceil(
                        remainingPt / normalPt
                    )
                    : 0;


            // =========================
            // 活動場打完之後還缺多少勳章
            // =========================

            const remainingBadge =
                needBadge -
                eventGames * eventBadge;


            const normalGamesForBadge =
                remainingBadge > 0
                    ? Math.ceil(
                        remainingBadge / normalBadge
                    )
                    : 0;


            // =========================
            // 一般場數必須同時滿足：
            //
            // CP
            // pt
            // 勳章
            // =========================

            const normalGames =
                Math.max(
                    normalGamesForCP,
                    normalGamesForPt,
                    normalGamesForBadge
                );


            // =========================
            // 總場數
            // =========================

            const totalGames =
                normalGames +
                eventGames;


            // =========================
            // 每 5 場 = 1 火
            // =========================

            const fireNeeded =
                Math.ceil(totalGames / 5);


            // =========================
            // 比較最佳方案
            // =========================

            if (
                best === null ||

                // 第一優先：火最少
                fireNeeded < best.fire ||

                // 第二優先：總場數最少
                (
                    fireNeeded === best.fire &&
                    totalGames < best.totalGames
                ) ||

                // 第三優先：活動場較少
                (
                    fireNeeded === best.fire &&
                    totalGames === best.totalGames &&
                    eventGames < best.eventGames
                )
            ) {

                best = {
                    normalGames: normalGames,
                    eventGames: eventGames,
                    totalGames: totalGames,
                    fire: fireNeeded
                };
            }
        }


        // =========================
        // 沒找到方案
        // =========================

        if (best === null) {
            throw new Error("找不到符合條件的組合。");
        }


        // =========================
        // 計算最後實際得到多少
        // =========================

        const totalPt =
            best.normalGames * normalPt +
            best.eventGames * eventPt;

        const totalBadge =
            best.normalGames * normalBadge +
            best.eventGames * eventBadge;

        const totalCp =
            best.normalGames * normalBase.cp;

        const requiredCp =
            best.eventGames * 200;


        // =========================
        // 數字格式化
        // =========================

        function formatNumber(value) {
            if (Number.isInteger(value)) {
                return value.toString();
            }

            return value.toFixed(2);
        }


        // =========================
        // 顯示結果
        // =========================

        document.getElementById('result').innerHTML = `

            一般場：
            <strong>${best.normalGames}</strong> 場<br>

            活動場：
            <strong>${best.eventGames}</strong> 場<br>

            消耗火：
            <strong>${best.fire} 火</strong><br><br>


            ──────────────────<br><br>


            CP：
            ${totalCp} / ${requiredCp}<br>

            最終 pt：
            ${formatNumber(totalPt)}<br>

            最終勳章：
            ${formatNumber(totalBadge)}<br><br>


            目標 pt：
            ${goalPt}<br>

            目標勳章：
            ${goalBadge}
        `;

    } catch (error) {

        // =========================
        // 錯誤處理
        // =========================

        console.error("calculate() error:", error);

        document.getElementById('result').innerHTML = `
            <strong>⚠️ 計算時發生錯誤</strong><br><br>

            ${error.message}<br><br>

            請檢查輸入數值與場次設定。
        `;
    }
}
</script>

</body>
</html>
